<div id="dock">

  <div class="dock-win-tabs" id="win-tabs"></div>
  <!-- 操作区 -->
  <div class="dock-row">
    <!-- 聊天/任务模式切换 -->
    <div class="dock-tabs">
      <span class="dock-tab active" data-mode="chat" id="mode-chat">聊天</span>
      <span class="dock-tab" data-mode="task" id="mode-task">任务</span>
    </div>
    <!-- 窗口选择下拉 -->
    <div class="win-select" id="win-select">
      <button class="win-select-btn" id="win-select-btn">发送到：<span id="win-select-val">无窗口</span> ▾</button>
      <div class="win-select-dropdown" id="win-select-dropdown"></div>
    </div>
    <!-- 多 agent 选择（任务模式） -->
    <div class="agent-selector" id="agent-selector">
      <div class="model-row" id="wf-row" style="display:none">
        <span class="model-label">工作流</span>
        <select id="workflow-select"></select>
        <button id="wf-open-builder" type="button" title="可视化编排：环节→卡片，点卡片亮/暗，⚙ 配置智能体/模型/任务/技能">🧩 编排</button>
      </div>
      <div class="agent-chips" id="agent-chips"></div>
      <div class="model-row" id="model-row" style="display:none">
        <span class="model-label">模型</span>
        <select id="model-select"></select>
      </div>
    </div>
    <textarea id="dock-input" rows="1" placeholder="输入消息…"></textarea>
    <button id="dock-send">发送</button>
    <button id="merge-btn" style="display:none" title="把打开的窗口合并成一个多标签大窗口（标签可拖出还原）">合并</button>
    <span class="conv-wrap">
      <button id="history-btn" title="查看历史对话">历史</button>
      <div class="conv-list" id="conv-list"></div>
    </span>
  </div>
  <!-- 窗口容器 -->
  <div id="win-container"></div>
  <!-- 会话消息停车场：合并窗口里非激活 tab 的消息容器暂存于此 -->
  <div id="msg-parking"></div>
</div>
<div id="history-panel">
  <div class="hp-head"><span id="hp-title">历史对话</span><button class="hp-close" id="history-close">×</button></div>
  <div class="hp-list" id="history-list"></div>
</div>
<div id="wf-builder">
  <div class="wfb-head">
    <span>🧩 工作流编排</span>
    <input id="wfb-name" placeholder="工作流名称">
    <button class="wfb-btn" id="wfb-save" type="button">保存</button>
    <button class="wfb-btn" id="wfb-run" type="button">▶ 运行</button>
    <button id="wfb-close" type="button" title="关闭">×</button>
  </div>
  <div class="wfb-hint">点卡片：亮=启用（工作流走这张卡）· 暗=停用；⚙ 配置智能体/模型/任务/技能；卡片按环节顺序执行，同环节多卡片=并行分工</div>
  <div class="wfb-loadrow">
    <span>载入：</span>
    <select id="wfb-load"><option value="">— 选择模板或已保存的工作流 —</option></select>
  </div>
  <div class="wfb-stages" id="wfb-stages"></div>
  <button id="wfb-add-stage" type="button">＋ 添加环节</button>
</div>
<div id="maestro" onclick="toggleList(event)">
  <div class="m-card">
    <div class="m-head"><span id="m-dot" class="m-dot"></span><span id="m-title">编排器连接中…</span></div>
    <div class="m-sub" id="m-sub">等待 Maestro 服务响应</div>
    <div class="m-offline" id="m-off">未连接 127.0.0.1:8787</div>
    <div class="m-list" id="m-list"></div>
  </div>
</div>
