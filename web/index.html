<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<title>Maestro × 芙莉莲 · 1:1 复刻（按 scene.json）</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  @font-face{font-family:"8bit";src:url("/wallpaper/models/frieren/fonts/8bitOperatorPlus8-Regular.ttf") format("truetype")}
  html,body{width:100%;height:100%;overflow:hidden;background:#bebdd7;font-family:"Segoe UI","PingFang SC",sans-serif}
  #stage{position:fixed;left:50%;top:50%;width:2560px;height:1440px;transform:translate(-50%,-50%) scale(var(--s,1));transform-origin:center}
  #bgcolor{position:absolute;left:0;top:0;width:2560px;height:1440px;background:#bebdd7}
  .p,.anchor{position:absolute;pointer-events:auto;will-change:transform;transform-origin:center;user-select:none}
  .anchor{pointer-events:none}  /* 锚点本身不接收事件，但保留尺寸 */
  img.p{display:block;object-fit:fill}
  .txt{position:absolute;white-space:nowrap;font-family:"8bit",ui-monospace,monospace;letter-spacing:1px;pointer-events:none;font-weight:400}
  #fx-bars{position:absolute;left:0;top:0;width:2560px;height:1440px;pointer-events:none;z-index:10}
  #fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:30}
  #hitface{position:absolute;cursor:pointer;z-index:50;pointer-events:auto}
  #maestro{position:fixed;top:18px;left:50%;transform:translateX(-50%);z-index:60;font-family:"Segoe UI","PingFang SC",system-ui,sans-serif;color:#3a3a55;cursor:pointer;user-select:none}
  .m-card{background:rgba(245,247,255,.82);border:1px solid rgba(80,90,140,.3);border-radius:12px;padding:9px 14px;min-width:240px;box-shadow:0 4px 18px rgba(40,50,100,.25);backdrop-filter:blur(5px)}
  .m-head{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:600;color:#33334f}
  .m-dot{width:8px;height:8px;border-radius:50%;background:#8a94ad;flex:none}
  .m-dot.running{background:#4da3ff;box-shadow:0 0 10px #4da3ff;animation:pulse 1.4s ease-in-out infinite}
  .m-dot.done{background:#34c96b;box-shadow:0 0 10px #34c96b}
  .m-dot.failed{background:#ef6a6a;box-shadow:0 0 10px #ef6a6a}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
  .m-sub{margin-top:5px;font-size:11.5px;color:#55557a;line-height:1.5}
  .m-sub b{color:#33335f;font-weight:600}
  .m-offline{font-size:10.5px;color:#8888a8;margin-top:4px}
  .m-list{display:none;margin-top:6px;border-top:1px solid rgba(80,90,140,.2);padding-top:4px;max-height:200px;overflow-y:auto;font-size:11px;color:#55557a}
  .m-list.show{display:block}
  .m-item{padding:4px 2px;border-bottom:1px solid rgba(80,90,140,.08)}
  .m-item .st{display:inline-block;width:44px;font-weight:600}
  .m-item .st.ok{color:#1fa855}.m-item .st.fail{color:#d64545}.m-item .st.run{color:#2f7fd6}
  #bubble{position:fixed;left:50%;bottom:38%;z-index:55;display:none;font-family:"Segoe UI","PingFang SC",sans-serif;font-size:15px;color:#1b2237;background:#f5f7ff;padding:10px 16px;border-radius:14px;box-shadow:0 4px 20px rgba(0,0,0,.35);max-width:340px;transform:translateX(-50%)}
  #bubble::after{content:"";position:absolute;bottom:-8px;left:50%;transform:translateX(-50%);border-left:8px solid transparent;border-right:8px solid transparent;border-top:8px solid #f5f7ff}
  /* 底部输入框（聊天 / 派任务 双模式） */
  #reply{position:fixed;left:50%;bottom:150px;transform:translateX(-50%);z-index:56;display:none;font-family:"Segoe UI","PingFang SC",sans-serif;font-size:14px;color:#1b2237;background:#f5f7ff;padding:12px 16px;border-radius:14px;box-shadow:0 4px 20px rgba(0,0,0,.35);max-width:520px;line-height:1.55;white-space:pre-wrap;word-break:break-word}
  #reply::after{content:"";position:absolute;bottom:-8px;left:50%;transform:translateX(-50%);border-left:8px solid transparent;border-right:8px solid transparent;border-top:8px solid #f5f7ff}
  #dock{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:56;display:flex;flex-direction:column;gap:7px;align-items:center;font-family:"Segoe UI","PingFang SC",sans-serif}
  .dock-tabs{display:flex;gap:3px;background:rgba(245,247,255,.82);border:1px solid rgba(80,90,140,.3);border-radius:10px;padding:3px}
  .dock-tab{font-size:12px;color:#55557a;padding:4px 15px;border-radius:7px;cursor:pointer;user-select:none;transition:all .15s}
  .dock-tab.active{background:#5b6bb5;color:#fff}
  .dock-row{display:flex;gap:8px;align-items:flex-end;background:rgba(245,247,255,.9);border:1px solid rgba(80,90,140,.3);border-radius:12px;padding:8px 11px;box-shadow:0 4px 18px rgba(40,50,100,.25);backdrop-filter:blur(5px);flex-wrap:wrap}
  /* ===== 多 agent 选择器 ===== */
  .agent-selector{
    display:none;flex-direction:column;gap:5px;
    width:100%;padding:8px 0 0;
  }
  .agent-selector.visible{display:flex}
  .agent-label{font-size:11px;color:#7a7aa8;font-weight:600;letter-spacing:.05em;text-transform:uppercase}
  .agent-chips{display:flex;flex-wrap:wrap;gap:5px}
  .agent-chip{
    display:flex;align-items:center;gap:4px;
    padding:3px 8px 3px 5px;border-radius:20px;cursor:pointer;
    border:1.5px solid rgba(91,107,181,.3);background:rgba(245,247,255,.7);
    font-size:11px;color:#55557a;transition:all .15s;user-select:none
  }
  .agent-chip input[type=checkbox]{display:none}
  .agent-chip .chip-check{
    width:13px;height:13px;border-radius:3px;border:1.5px solid rgba(91,107,181,.4);
    display:flex;align-items:center;justify-content:center;flex:none;transition:all .12s;
    background:#fff
  }
  .agent-chip .chip-check::after{content:'✓';font-size:8px;color:#fff;opacity:0;transition:opacity .1s}
  .agent-chip.selected{border-color:#5b6bb5;background:rgba(91,107,181,.12);color:#33334f}
  .agent-chip.selected .chip-check{background:#5b6bb5;border-color:#5b6bb5}
  .agent-chip.selected .chip-check::after{opacity:1}
  .agent-chip.disabled{opacity:.45;cursor:not-allowed}
  .agent-chip:hover:not(.disabled){border-color:#5b6bb5}
  .agent-chip .chip-dot{
    width:5px;height:5px;border-radius:50%;background:#4caf50;flex:none;margin-left:2px
  }
  .agent-chip.disabled .chip-dot{background:#ccc}
  /* ===== 模型选择器 ===== */
  .model-row{display:flex;align-items:center;gap:6px}
  .model-label{font-size:11px;color:#7a7aa8;white-space:nowrap}
  #model-select{
    flex:1;min-width:0;padding:4px 8px;border-radius:7px;
    border:1.5px solid rgba(91,107,181,.3);background:rgba(245,247,255,.8);
    font-size:12px;color:#33334f;cursor:pointer;outline:none;
    transition:border-color .15s
  }
  #model-select:focus{border-color:#5b6bb5}
  #model-select option{padding:2px}
  #dock-input{width:340px;border:none;outline:none;background:transparent;font-size:14px;color:#1b2237;font-family:inherit;
    resize:none;max-height:110px;line-height:1.45;padding:7px 0;overflow-y:auto}
  #dock-input::placeholder{color:#9a9ab8}
  #dock-send{border:none;background:#5b6bb5;color:#fff;font-size:13px;padding:7px 16px;border-radius:8px;cursor:pointer;font-family:inherit}
  #dock-send:hover{background:#4d5ca5}
  #history-btn{border:none;background:rgba(90,105,175,.15);color:#4d5ca5;font-size:13px;padding:7px 12px;border-radius:8px;cursor:pointer;font-family:inherit}
  #history-btn:hover{background:rgba(90,105,175,.25)}
  /* 会话列表（hover 历史按钮弹出） */
  .conv-wrap{position:relative}
  /* 透明桥：覆盖按钮与浮层之间的 8px 间隙，鼠标上滑时 hover 不断 */
  .conv-wrap::after{content:"";position:absolute;left:0;right:0;bottom:100%;height:8px}
  .conv-list{position:absolute;bottom:calc(100% + 8px);right:0;width:290px;max-height:300px;overflow-y:auto;background:rgba(250,251,255,.97);border:1px solid rgba(80,90,140,.3);border-radius:12px;box-shadow:0 6px 30px rgba(40,50,100,.3);display:none;z-index:75;padding:6px;backdrop-filter:blur(8px)}
  .conv-wrap:hover .conv-list{display:block}
  .cv-item{padding:8px 10px;border-radius:8px;cursor:pointer}
  .cv-item:hover{background:rgba(90,105,175,.1)}
  .cv-item.active{background:rgba(91,107,181,.18)}
  .cv-ops{display:none;gap:3px;flex:none}
  .cv-item:hover .cv-ops{display:flex}
  .cv-op{border:none;background:rgba(90,105,175,.14);color:#4d5ca5;font-size:11px;padding:2px 7px;border-radius:5px;cursor:pointer;line-height:1.5;font-family:inherit}
  .cv-op:hover{background:rgba(90,105,175,.3)}
  .cv-op.del{color:#d64545;background:rgba(214,69,69,.1)}
  .cv-op.del:hover{background:rgba(214,69,69,.22)}
  .cv-title{font-size:13px;color:#33334f;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:flex;align-items:center;gap:6px}
  .cv-title .cv-name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .cv-time{font-size:10px;color:#a8a8c5;font-weight:400;flex:none}
  .cv-prev{font-size:11px;color:#9a9ab8;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .cv-empty{text-align:center;color:#9a9ab8;padding:16px;font-size:12px}
  .cv-new{padding:8px 10px;border-radius:8px;cursor:pointer;font-size:13px;color:#4d5ca5;font-weight:600;border-bottom:1px solid rgba(80,90,140,.1);margin-bottom:4px;user-select:none}
  .cv-new:hover{background:rgba(90,105,175,.12)}
  /* 历史对话面板 */
  #history-panel{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:560px;max-width:92vw;max-height:70vh;background:rgba(250,251,255,.96);border:1px solid rgba(80,90,140,.3);border-radius:16px;box-shadow:0 8px 40px rgba(40,50,100,.3);z-index:70;display:none;flex-direction:column;font-family:"Segoe UI","PingFang SC",sans-serif;backdrop-filter:blur(8px)}
  #history-panel.show{display:flex}
  .hp-head{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:1px solid rgba(80,90,140,.15);font-size:14px;font-weight:600;color:#33334f;cursor:grab;user-select:none}
  .hp-head:active{cursor:grabbing}
  .hp-close{border:none;background:transparent;font-size:20px;color:#8888a8;cursor:pointer;line-height:1;padding:0 4px}
  .hp-close:hover{color:#4d5ca5}
  .hp-list{flex:1;overflow-y:auto;padding:12px 16px;display:flex;flex-direction:column;gap:8px}
  .hp-msg{max-width:78%;padding:8px 12px;border-radius:12px;font-size:13px;line-height:1.5;white-space:pre-wrap;word-break:break-word}
  .hp-msg.user{align-self:flex-end;background:#5b6bb5;color:#fff;border-bottom-right-radius:4px}
  .hp-msg.assistant{align-self:flex-start;background:#eceefc;color:#1b2237;border-bottom-left-radius:4px}
  .hp-time{font-size:10px;color:rgba(155,155,185,.9);margin-top:3px;text-align:right}
  .hp-msg.assistant .hp-time{text-align:left;color:#9a9ab8}
  .hp-empty{text-align:center;color:#9a9ab8;padding:30px 0;font-size:13px}
  /* 流式打字机光标 */
  #reply .caret{display:inline-block;animation:caretblink .8s step-end infinite;color:#5b6bb5;font-weight:700}
  @keyframes caretblink{50%{opacity:0}}
  @keyframes ringspin{from{transform:translate(-50%,-50%) rotate(0deg)}to{transform:translate(-50%,-50%) rotate(360deg)}}
  .ring{animation:ringspin 6s linear infinite}
  /* 眨眼：用 WE 关键帧 origin 位移（edcv/rfvb：眼闭合时眼睑下移覆盖），0-92% 睁开 92-96% 闭合 96-100% 睁开 */
  @keyframes blink{0%,88%,100%{transform:translate(-50%,-50%) translateY(0) scaleY(1)}92%,96%{transform:translate(-50%,-50%) translateY(1.2px) scaleY(0.12)}}
  .eye{animation:blink 4.2s ease-in-out infinite}
  /* idle 呼吸：身体/头轻微浮动（原版 Live2D 物理近似），非等比缩放更像真实呼吸 */
  @keyframes breathe{0%,100%{transform:translate(-50%,-50%) translateY(0) scale(1,1)}50%{transform:translate(-50%,-50%) translateY(-2.5px) scale(1.006,1.012)}}
  .breathe{animation:breathe 3.6s ease-in-out infinite}
  /* 嘟嘴/皱眉/嘴（表情切换用，默认隐藏） */
  .expr{display:none}

  /* ===== 多窗口系统 ===== */
  .win{
    position:fixed;z-index:500;background:rgba(250,251,255,.96);border:1px solid rgba(80,90,140,.35);
    border-radius:14px;box-shadow:0 8px 40px rgba(40,50,100,.35);backdrop-filter:blur(12px);
    display:flex;flex-direction:column;font-family:"Segoe UI","PingFang SC",sans-serif;
    width:420px;height:380px;pointer-events:auto;transition:border-color .15s,box-shadow .15s
  }
  .win.minimized{transform:scale(0);opacity:0;pointer-events:none}
  .win.focused{border-color:rgba(91,107,181,.8)!important;box-shadow:0 8px 40px rgba(40,50,100,.35),0 0 0 3px rgba(91,107,181,.22)}
  .win:not(.focused){border-color:rgba(80,90,140,.15);box-shadow:0 4px 20px rgba(40,50,100,.15)}
  .win-head{
    display:flex;align-items:center;justify-content:space-between;padding:8px 12px;
    background:rgba(91,107,181,.12);border-bottom:1px solid rgba(80,90,140,.15);
    border-radius:13px 13px 0 0;cursor:grab;user-select:none;transition:background .15s
  }
  .win.focused .win-head{background:rgba(91,107,181,.22)}
  .win-head:active{cursor:grabbing}
  .win-title{font-size:13px;font-weight:600;color:#33334f;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .win-kind{font-size:10px;color:#7a7aa8;margin-left:8px;flex:none}
  .win-btns{display:flex;gap:6px;margin-left:10px}
  .win-btn{
    width:22px;height:22px;border:none;border-radius:5px;cursor:pointer;font-size:14px;line-height:1;
    display:flex;align-items:center;justify-content:center;transition:all .12s
  }
  .win-btn.min{background:rgba(90,105,175,.15);color:#5a6a95}
  .win-btn.min:hover{background:rgba(90,105,175,.3)}
  .win-btn.max{background:rgba(90,105,175,.15);color:#5a6a95}
  .win-btn.max:hover{background:rgba(90,105,175,.3)}
  .win-btn.close{background:rgba(214,69,69,.12);color:#c64545}
  .win-btn.close:hover{background:rgba(214,69,69,.25);color:#fff}
  .win-body{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:8px}
  .win-foot{
    display:flex;gap:8px;padding:10px 12px;border-top:1px solid rgba(80,90,140,.12);
    background:rgba(245,247,255,.5);border-radius:0 0 13px 13px
  }
  .win-input{flex:1;border:none;outline:none;background:rgba(255,255,255,.7);font-size:14px;
    color:#1b2237;padding:8px 12px;border-radius:8px;font-family:inherit}
  .win-input::placeholder{color:#9a9ab8}
  .win-send{
    border:none;background:#5b6bb5;color:#fff;font-size:13px;padding:8px 16px;border-radius:8px;
    cursor:pointer;font-family:inherit
  }
  .win-send:hover{background:#4d5ca5}
  /* ===== 窗口内消息（头像 / Markdown / 操作按钮 / 入场动画） ===== */
  .win-msg{max-width:86%;padding:8px 12px;border-radius:12px;font-size:13px;line-height:1.55;
    white-space:pre-wrap;word-break:break-word;position:relative;animation:msg-in .18s ease-out}
  .win-msg.user{align-self:flex-end;background:#5b6bb5;color:#fff;border-bottom-right-radius:4px}
  .win-msg.assistant{align-self:flex-start;background:#eceefc;color:#1b2237;border-bottom-left-radius:4px;margin-left:26px}
  .win-msg.md-msg{white-space:normal}
  .win-msg.cont{margin-top:-4px}
  .win-msg.assistant.cont{margin-top:-6px}
  @keyframes msg-in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .win-msg .caret{display:inline-block;width:2px;height:13px;background:#5b6bb5;vertical-align:-2px;
    animation:caretblink .8s step-end infinite;margin-left:2px}
  .msg-meta{display:flex;align-items:center;gap:6px;margin-top:3px}
  .win-msg.user .msg-meta{justify-content:flex-end}
  .win-time{font-size:10px;color:#a8a8c5}
  .win-msg.user .win-time{color:rgba(255,255,255,.7)}
  .win-msg.assistant .win-time{color:#9a9ab8}
  /* 助手头像 */
  .msg-avatar{position:absolute;left:-26px;bottom:4px;width:20px;height:20px;border-radius:50%;
    border:1.5px solid rgba(91,107,181,.35);background:#fff;object-fit:cover}
  /* 时间分隔线 */
  .msg-divider{align-self:center;font-size:10px;color:#9a9ab8;background:rgba(148,155,195,.14);
    padding:2px 10px;border-radius:8px;margin:6px 0 2px}
  /* 悬停操作条 */
  .msg-ops{position:absolute;top:-11px;right:6px;display:none;gap:1px;background:#fff;
    border:1px solid rgba(80,90,140,.25);border-radius:6px;padding:1px;box-shadow:0 2px 8px rgba(40,50,100,.18);z-index:5}
  .win-msg:hover .msg-ops{display:flex}
  .msg-ops button{border:none;background:transparent;font-size:11px;color:#4d5ca5;padding:2px 6px;
    border-radius:4px;cursor:pointer;line-height:1.4}
  .msg-ops button:hover{background:rgba(90,105,175,.12)}
  /* Markdown */
  .md-msg .msg-content p{margin:0 0 6px}
  .md-msg .msg-content p:last-of-type{margin-bottom:0}
  .md-msg .msg-content h1,.md-msg .msg-content h2,.md-msg .msg-content h3,.md-msg .msg-content h4{
    margin:8px 0 4px;font-size:13.5px;color:#33334f}
  .md-msg .msg-content h1{font-size:15px}
  .md-msg .msg-content h2{font-size:14px}
  .md-msg .msg-content ul,.md-msg .msg-content ol{margin:2px 0 6px;padding-left:18px}
  .md-msg .msg-content li{margin:2px 0}
  .md-msg .msg-content blockquote{margin:4px 0;padding:4px 10px;border-left:3px solid rgba(91,107,181,.4);
    background:rgba(91,107,181,.06);border-radius:4px;color:#55557a}
  .md-msg .msg-content a{color:#4d5ca5}
  .md-inline{background:rgba(91,107,181,.1);padding:0 4px;border-radius:4px;
    font-family:Consolas,monospace;font-size:12px}
  .md-code{margin:6px 0;border:1px solid rgba(80,90,140,.25);border-radius:8px;overflow:hidden;background:#282c40}
  .md-code-bar{display:flex;justify-content:space-between;align-items:center;padding:3px 10px;
    background:rgba(255,255,255,.06);font-size:10.5px;color:#aab2d8}
  .md-code-copy{border:none;background:rgba(255,255,255,.08);color:#c6cdf2;font-size:10.5px;
    padding:2px 8px;border-radius:5px;cursor:pointer}
  .md-code-copy:hover{background:rgba(255,255,255,.16)}
  .md-code pre{margin:0;padding:10px 12px;overflow-x:auto}
  .md-code code{font-family:Consolas,"Courier New",monospace;font-size:12px;color:#dce2ff;line-height:1.5}
  /* 长回复折叠 */
  .win-msg.folded .msg-content{max-height:180px;overflow:hidden;position:relative}
  .win-msg.folded .msg-content::after{content:"";position:absolute;left:0;right:0;bottom:0;height:44px;
    background:linear-gradient(transparent,#eceefc)}
  .md-fold-btn{border:none;background:rgba(90,105,175,.12);color:#4d5ca5;font-size:10.5px;
    padding:2px 8px;border-radius:5px;cursor:pointer}
  /* 打字指示（芙莉莲正在输入） */
  .win-msg.typing .msg-content{display:flex;gap:4px;align-items:center;padding:3px 0}
  .win-msg.typing .dot{width:6px;height:6px;border-radius:50%;background:#8a94c8;
    animation:typing-bounce 1.2s ease-in-out infinite}
  .win-msg.typing .dot:nth-child(2){animation-delay:.15s}
  .win-msg.typing .dot:nth-child(3){animation-delay:.3s}
  @keyframes typing-bounce{0%,60%,100%{transform:translateY(0);opacity:.5}30%{transform:translateY(-4px);opacity:1}}
  /* ===== 任务进度卡片 ===== */
  .task-card{align-self:stretch;max-width:100%;background:#fff;border:1px solid rgba(80,90,140,.28);
    border-radius:12px;padding:10px 12px;font-size:12px;color:#1b2237;position:relative;animation:msg-in .18s ease-out}
  .task-card .tc-head{display:flex;align-items:center;gap:6px;font-weight:600;color:#33334f;font-size:12.5px;min-width:0}
  .task-card .tc-prompt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .task-card .tc-status{font-size:10.5px;padding:1px 8px;border-radius:8px;font-weight:600;flex:none}
  .task-card .tc-status.running{background:rgba(77,163,255,.15);color:#2f7fd6}

  <div class="m-card">
    <div class="m-head"><span id="m-dot" class="m-dot"></span><span id="m-title">编排器连接中…</span></div>
    <div class="m-sub" id="m-sub">等待 Maestro 服务响应</div>
    <div class="m-offline" id="m-off">未连接 127.0.0.1:8787</div>
    <div class="m-list" id="m-list"></div>
  </div>
</div>
<script>
(function(){
"use strict";

  // ========== WindowManager 多窗口系统 ==========
  var winContainer=document.getElementById("win-container");
  var winTabsEl=document.getElementById("win-tabs");
  var winZ=500; // z-index 计数器
  var wins={}; // id -> {el, data, minimized}
  var activeWinId=null;
  var WIN_OFFSET=50; // 窗口堆叠偏移（向上）

  // 窗口模板（无输入框，统一用底部 Dock 输入框）
  function createWinHTML(id,title,kind){
    return '<div class="win" data-id="'+id+'" style="display:none">'+
      '<div class="win-head" data-win="drag">'+
        '<span class="win-title">'+escapeHtml(title)+'</span>'+
        '<span class="win-kind">['+(kind==="task"?"任务":"聊天")+']</span>'+
        '<div class="win-btns">'+
          '<button class="win-btn min" data-win="min" title="最小化">&#x2212;</button>'+
          '<button class="win-btn max" data-win="max" title="最大化">&#x25A1;</button>'+
          '<button class="win-btn close" data-win="close" title="关闭">×</button>'+
        '</div>'+
      '</div>'+
      '<div class="win-body" id="win-body-'+id+'"></div>'+
      '<div class="win-resize" data-win="resize"></div>'+
    '</div>';
  }

  // 创建窗口
  function winCreate(id,title,kind){
    if(wins[id]){winActivate(id);return wins[id]}
    var el=document.createElement("div");
    el.innerHTML=createWinHTML(id,title,kind);
    el=el.firstElementChild;
    document.body.appendChild(el);
    // 位置：右下角向上堆叠（不遮挡 dock）
    var idx=Object.keys(wins).length;
    el.style.right="20px";
    el.style.bottom=(140+idx*WIN_OFFSET)+"px";
    // 事件绑定
    el.querySelector(".win-head").addEventListener("mousedown",function(e){winDragStart(e,id)});
    el.querySelector(".win-resize").addEventListener("mousedown",function(e){winResizeStart(e,id)});
    el.querySelectorAll(".win-btn").forEach(function(btn){
      btn.addEventListener("click",function(e){
        var act=btn.dataset.win;
        if(act==="min")winMinimize(id);
        else if(act==="max")winMaximize(id);
        else if(act==="close")winClose(id);
      });
    });
    wins[id]={el:el,data:{id:id,title:title,kind:kind},minimized:false};
    winActivate(id);
    winTabsRender();
    return wins[id];
  }

  // 激活窗口
  function winActivate(id){
    var w=wins[id];
    if(!w)return;
    if(activeWinId&&wins[activeWinId]){
      wins[activeWinId].el.style.zIndex=winZ++;
    }
    activeWinId=id;
    selectedWinId=id; // 自动选中该窗口
    w.el.style.zIndex=winZ++;
    w.el.style.display="flex";
    w.el.classList.remove("minimized");
    w.minimized=false;
    // 移除小卡片
    removeWinMini(id);
    // 更新焦点视觉状态
    updateWinFocus(id);
    winTabsRender();
    winSelectRender();
    // 动态更新 dock 输入框 placeholder
    updateDockPlaceholder();
    dockInput.focus(); // 聚焦到底部输入框
  }

  // 更新所有窗口的焦点状态（给选中窗口加 .focused）
  function updateWinFocus(focusedId){
    Object.keys(wins).forEach(function(k){
      if(k===focusedId) wins[k].el.classList.add("focused");
      else wins[k].el.classList.remove("focused");
    });
  }

  // 更新 dock 输入框 placeholder 为当前选中窗口名
  function updateDockPlaceholder(){
    var sel=wins[selectedWinId];
    if(sel){
      dockInput.placeholder="向【"+sel.data.title.slice(0,8)+"】发送消息…";
    }else{
      dockInput.placeholder="选择一个窗口或新建窗口后发送…";
    }
  }

  // 最小化窗口
  function winMinimize(id){
    var w=wins[id];
    if(!w)return;
    w.minimized=true;
    w.el.classList.add("minimized");
    // 创建小卡片
    createWinMini(id);
    if(activeWinId===id){
      // 激活其他窗口
      var others=Object.keys(wins).filter(function(k){return k!==id&&!wins[k].minimized});
      if(others.length)winActivate(others[others.length-1]);
      activeWinId=null;
    }
    winTabsRender();
  }

  // 创建窗口小卡片
  function createWinMini(id){
    var w=wins[id];
    if(!w)return;
    // 如果已存在小卡片，先移除
    var existing=document.getElementById("win-mini-"+id);
    if(existing){existing.remove();}
    var mini=document.createElement("div");
    mini.id="win-mini-"+id;
    mini.className="win-mini";
    mini.innerHTML='<div class="win-mini-title">'+escapeHtml(w.data.title)+'</div>'+
      '<div class="win-mini-kind">['+(w.data.kind==="task"?"任务":"聊天")+']</div>'+
      '<div class="win-mini-drag" data-mini="drag"></div>';
    document.body.appendChild(mini);
    // 点击小卡片恢复窗口
    mini.addEventListener("click",function(e){
      if(e.target.dataset.mini==="drag")return;
      winActivate(id);
    });
    // 小卡片拖动
    var miniDrag=null,miniOffX=0,miniOffY=0;
    mini.querySelector(".win-mini-drag").addEventListener("mousedown",function(e){
      miniDrag=mini;
      var rect=mini.getBoundingClientRect();
      miniOffX=e.clientX-rect.left;
      miniOffY=e.clientY-rect.top;
      e.stopPropagation();
    });
    document.addEventListener("mousemove",function(e){
      if(!miniDrag)return;
      miniDrag.style.left=(e.clientX-miniOffX)+"px";
      miniDrag.style.top=(e.clientY-miniOffY)+"px";
      miniDrag.style.right="";miniDrag.style.bottom="";
    });
    document.addEventListener("mouseup",function(){
      miniDrag=null;
    });
  }

  // 移除窗口小卡片
  function removeWinMini(id){
    var mini=document.getElementById("win-mini-"+id);
    if(mini){mini.remove();}
  }

  // 最大化窗口（简化：全屏）
  function winMaximize(id){
    var w=wins[id];
    if(!w)return;
    if(w.el.style.width==="100vw"){
      // 恢复
      w.el.style.width="";w.el.style.height="";w.el.style.right="";w.el.style.bottom="";
    }else{
      w.el.style.width="100vw";w.el.style.height="100vh";
      w.el.style.right="0";w.el.style.bottom="0";
    }
  }

  // 关闭窗口
  function winClose(id){
    var w=wins[id];
    if(!w)return;
    removeWinMini(id); // 移除小卡片
    w.el.remove();
    delete wins[id];
    if(activeWinId===id){
      var others=Object.keys(wins).filter(function(k){return !wins[k].minimized});
      if(others.length)winActivate(others[others.length-1]);
      else{activeWinId=null;selectedWinId=null;updateDockPlaceholder()}
    }
    winTabsRender();
    saveWindowsState(); // 保存窗口状态到 localStorage
  }

  // 保存窗口状态到 localStorage
  function saveWindowsState(){
    var state=Object.keys(wins).map(function(k){
      var w=wins[k];
      var el=w.el;
      return {
        id:w.data.id,
        title:w.data.title,
        kind:w.data.kind,
        minimized:w.minimized,
        left:el.style.left,
        top:el.style.top,
        right:el.style.right,
        bottom:el.style.bottom,
        width:el.style.width,
        height:el.style.height
      };
    });
    localStorage.setItem("maestro_windows",JSON.stringify(state));
  }

  // 从 localStorage 恢复窗口状态
  function restoreWindows(){
    try{
      var data=localStorage.getItem("maestro_windows");
      if(!data)return;
      var state=JSON.parse(data);
      if(!Array.isArray(state)||state.length===0)return;
      // 按保存顺序恢复窗口
      state.forEach(function(s){
        var w=winCreate(s.id,s.title,s.kind);
        if(!w)return;
        var el=w.el;
        if(s.left)el.style.left=s.left;
        if(s.top)el.style.top=s.top;
        if(s.right)el.style.right=s.right;
        if(s.bottom)el.style.bottom=s.bottom;
        if(s.width)el.style.width=s.width;
        if(s.height)el.style.height=s.height;
        if(s.minimized){
          winMinimize(s.id);
        }
      });
    }catch(e){
      console.error("恢复窗口失败:",e);
    }
  }

  // 页面加载完成后恢复窗口
  setTimeout(restoreWindows,500);

  // ========== 消息渲染引擎：Markdown / 头像 / 时间分隔 / 操作按钮 ==========
  var MD_FOLD_LEN = 1400;          // 超过该长度折叠"展开全文"
  var AVATAR_HTML = '<img class="msg-avatar" src="pet_frieren_q.png" alt="">';

  // 行内 Markdown（先转义再替换，天然防注入）
  function mdInline(raw) {
    var s = escapeHtml(raw);
    s = s.replace(/`([^`]+)`/g, function(_, c) { return '<code class="md-inline">' + c + '</code>'; });
    s = s.replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>");
    s = s.replace(/~~([^~]+)~~/g, "<s>$1</s>");
    s = s.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,
      '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
    return s.replace(/\n/g, "<br>");
  }

  function mdCodeBlock(c) {
    return '<div class="md-code"><div class="md-code-bar"><span>' + escapeHtml(c.lang || "代码") + '</span>' +
      '<button type="button" class="md-code-copy">复制代码</button></div>' +
      '<pre><code>' + escapeHtml(c.code) + '</code></pre></div>';
  }

  // 块级 Markdown：围栏代码 / 标题 / 列表 / 引用 / 分隔线 / 段落
  function mdRender(src) {
    src = String(src || "").replace(/\r\n/g, "\n").trim();
    if (!src) return "";
    var codes = [];
    src = src.replace(/```([\w+#.-]*)[ \t]*\n?([\s\S]*?)```/g, function(_, lang, code) {
      codes.push({ lang: lang, code: code.replace(/\n$/, "") });
      return "\x00C" + (codes.length - 1) + "\x00";
    });
    var lines = src.split("\n"), out = [], list = null, quote = false, para = [];
    function flushPara() { if (para.length) { out.push("<p>" + mdInline(para.join("\n")) + "</p>"); para = []; } }
    function closeList() { if (list) { out.push(list === "ul" ? "</ul>" : "</ol>"); list = null; } }
    function closeQuote() { if (quote) { out.push("</blockquote>"); quote = false; } }
    for (var i = 0; i < lines.length; i++) {
      var ln = lines[i];
      var cm = ln.match(/^\x00C(\d+)\x00\s*$/);
      if (cm) { flushPara(); closeList(); closeQuote(); out.push(mdCodeBlock(codes[+cm[1]])); continue; }
      if (!ln.trim()) { flushPara(); closeList(); closeQuote(); continue; }
      var h = ln.match(/^(#{1,4})\s+(.*)$/);
      if (h) { flushPara(); closeList(); closeQuote(); out.push("<h" + h[1].length + ">" + mdInline(h[2]) + "</h" + h[1].length + ">"); continue; }
      if (/^(-{3,}|\*{3,}|_{3,})$/.test(ln.trim())) { flushPara(); closeList(); closeQuote(); out.push("<hr>"); continue; }
      var q = ln.match(/^>\s?(.*)$/);
      if (q) { flushPara(); closeList(); if (!quote) { out.push("<blockquote>"); quote = true; } out.push("<p>" + mdInline(q[1]) + "</p>"); continue; }
      closeQuote();
      var ul = ln.match(/^\s*[-*+]\s+(.*)$/);
      var ol = ln.match(/^\s*\d+[.、)]\s+(.*)$/);
      if (ul || ol) {
        flushPara();
        var tag = ul ? "ul" : "ol";
        if (list !== tag) { closeList(); out.push("<" + tag + ">"); list = tag; }
        out.push("<li>" + mdInline((ul || ol)[1]) + "</li>");
        continue;
      }
      closeList();
      para.push(ln);
    }
    flushPara(); closeList(); closeQuote();
    return out.join("").replace(/\x00C(\d+)\x00/g, function(_, n) { return mdCodeBlock(codes[+n]); });
  }

  // 长回复折叠：>MD_FOLD_LEN 时收起并给"展开全文"按钮
  function applyFold(div, text) {
    if (text.length <= MD_FOLD_LEN || div.classList.contains("folded") || div.querySelector(".md-fold-btn")) return;
    div.classList.add("folded");
    var meta = div.querySelector(".msg-meta");
    if (meta) {
      var b = document.createElement("button");
      b.type = "button";
      b.className = "md-fold-btn";
      b.textContent = "展开全文";
      meta.appendChild(b);
    }
  }

  // 消息 DOM 构造（头像/操作条/时间分隔/连续合并）
  function buildMsgEl(role, text, cont) {
    var div = document.createElement("div");
    div.className = "win-msg " + role + (cont ? " cont" : "") + (role === "assistant" ? " md-msg" : "");
    div.dataset.text = text;
    var contentHtml = role === "assistant" ? mdRender(text) : escapeHtml(text);
    div.innerHTML = (role === "assistant" ? AVATAR_HTML : "") +
      '<div class="msg-content">' + contentHtml + '</div>' +
      '<div class="msg-meta"><span class="win-time">' + new Date().toLocaleTimeString() + '</span></div>';
    var ops = document.createElement("div");
    ops.className = "msg-ops";
    ops.innerHTML = '<button type="button" data-op="copy" title="复制">复制</button>' +
      (role === "user" ? '<button type="button" data-op="resend" title="重新发送">重发</button>'
                       : '<button type="button" data-op="quote" title="引用到输入框">引用</button>');
    div.appendChild(ops);
    return div;
  }

  // 打字指示（芙莉莲正在输入…）
  function showTyping(id) {
    var w = wins[id];
    if (!w) return;
    hideTyping(id);
    var body = w.el.querySelector(".win-body");
    var div = document.createElement("div");
    div.className = "win-msg assistant typing" + (w._lastMsg && w._lastMsg.role === "assistant" ? " cont" : "");
    div.innerHTML = AVATAR_HTML + '<div class="msg-content"><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>';
    body.appendChild(div);
    body.scrollTop = body.scrollHeight;
  }
  function hideTyping(id) {
    var w = wins[id];
    if (!w) return;
    var t = w.el.querySelector(".win-msg.typing");
    if (t) t.remove();
  }

  // 操作按钮 / 折叠 / 代码复制：事件委托（气泡内容会被流式重写，不能逐个绑）
  document.addEventListener("click", function(e) {
    var opBtn = e.target.closest(".msg-ops button");
    if (opBtn) {
      var msg = opBtn.closest(".win-msg");
      var winEl = opBtn.closest(".win");
      if (!msg || !winEl) return;
      var op = opBtn.dataset.op;
      if (op === "copy") {
        if (navigator.clipboard) navigator.clipboard.writeText(msg.dataset.text || "").catch(function() {});
      } else if (op === "copytask") {
        var taskEl = opBtn.closest(".task-card");
        var resEl2 = taskEl && taskEl.querySelector(".tc-result");
        var txt2 = (resEl2 && resEl2.dataset.raw) || (resEl2 && resEl2.textContent) || "";
        if (navigator.clipboard) navigator.clipboard.writeText(txt2).catch(function() {});
        opBtn.textContent = "已复制";
        setTimeout(function() { opBtn.textContent = "复制结果"; }, 1200);
      } else if (op === "resend") {
        var winId = winEl.dataset.id;
        if (winId && wins[winId]) doSend(winId, msg.dataset.text || "");
      } else if (op === "quote") {
        dockInput.value = "> " + (msg.dataset.text || "").slice(0, 200) + "\n";
        dockInput.focus();
      }
      return;
    }
    var foldBtn = e.target.closest(".md-fold-btn");
    if (foldBtn) {
      var mb = foldBtn.closest(".win-msg");
      mb.classList.toggle("folded");
      foldBtn.textContent = mb.classList.contains("folded") ? "展开全文" : "收起";
      return;
    }
    var copyBtn = e.target.closest(".md-code-copy");
    if (copyBtn) {
      var code = copyBtn.closest(".md-code").querySelector("code");
      if (code && navigator.clipboard) navigator.clipboard.writeText(code.textContent).catch(function() {});
      copyBtn.textContent = "已复制";
      setTimeout(function() { copyBtn.textContent = "复制代码"; }, 1200);
    }
  });

  // 窗口内追加消息（Markdown 渲染 / 时间分隔 / 连续合并 / 清除打字指示）
  function winAppendMsg(id,role,text){
    var w=wins[id];
    if(!w)return;
    if(role==="assistant")hideTyping(id);
    var body=w.el.querySelector(".win-body");
    var now=maybeAppendDivider(w,body);
    var last=w._lastMsg;
    var cont=last&&last.role===role&&(now-last.t)<120000;
    var div=buildMsgEl(role,text,cont);
    body.appendChild(div);
    if(role==="assistant"&&text.length>MD_FOLD_LEN)applyFold(div,text);
    body.scrollTop=body.scrollHeight;
    w._lastMsg={t:now,role:role};
    // 任务窗口：提交后标题加 ⚙
    if(w.data.kind==="task"&&text.includes("任务已提交")){
      var titleEl=w.el.querySelector(".win-title");
      if(titleEl&&!titleEl.textContent.includes("⚙")){
        titleEl.textContent="⚙ "+titleEl.textContent;
      }
    }
  }

  // ========== 任务进度卡片 ==========
  var TC_STATUS={pending:"待拆分",ready:"待确认",running:"运行中",done:"已完成",
                 failed:"已失败",retry:"重试中",cancelled:"已取消"};

  // 首条消息或距上一条 >10 分钟时插时间分隔线，返回当前时间戳
  function maybeAppendDivider(w,body){
    var now=Date.now(),last=w._lastMsg;
    if(!last||now-last.t>600000){
      var dv=document.createElement("div");
      dv.className="msg-divider";
      var d=new Date();
      var sameDay=last&&new Date(last.t).toDateString()===d.toDateString();
      dv.textContent=(sameDay?"":(d.getMonth()+1)+"-"+d.getDate()+" ")+
        ("00"+d.getHours()).slice(-2)+":"+("00"+d.getMinutes()).slice(-2);
      body.appendChild(dv);
    }
    return now;
  }

  // 任务提交 → 富卡片（状态/进度条/子任务实时状态/结果区），自带 2s 轮询到终态
  function winAppendTaskCard(id,taskId,agents,model,prompt){
    var w=wins[id];
    if(!w)return;
    hideTyping(id);
    var body=w.el.querySelector(".win-body");
    var now=maybeAppendDivider(w,body);
    var card=document.createElement("div");
    card.className="task-card";
    card.dataset.task=taskId;
    card.innerHTML=
      '<div class="tc-head"><span class="tc-status pending">待拆分</span>'+
        '<span class="tc-prompt">'+escapeHtml((prompt||"").slice(0,50))+'</span></div>'+
      '<div class="tc-meta">'+escapeHtml(agents.join(" + "))+(model?" · "+escapeHtml(model):"")+" · "+escapeHtml(taskId)+'</div>'+
      '<div class="tc-bar"><i></i></div>'+
      '<button type="button" class="tc-toggle" style="display:none">子任务</button>'+
      '<div class="tc-subs"></div>'+
      '<div class="tc-result"></div>';
    var ops=document.createElement("div");
    ops.className="msg-ops";
    ops.innerHTML='<button type="button" data-op="copytask" title="复制结果">复制结果</button>';
    card.appendChild(ops);
    body.appendChild(card);
    body.scrollTop=body.scrollHeight;
    w._lastMsg={t:now,role:"assistant"};
    var titleEl=w.el.querySelector(".win-title");
    if(titleEl&&!titleEl.textContent.includes("⚙")){
      titleEl.textContent="⚙ "+titleEl.textContent;
    }
    pollTaskCard(id,taskId);
  }

  function pollTaskCard(convId,taskId){
    fetch(MAESTRO+"/api/tasks/"+taskId,{cache:"no-store"})
      .then(function(r){return r.json()})
      .then(function(snap){
        if(!snap||!snap.task)return;
        var w=wins[convId];
        var card=w&&w.el.querySelector('.task-card[data-task="'+taskId+'"]');
        if(!card)return; // 窗口已关闭：停止轮询
        var t=snap.task;
        var chip=card.querySelector(".tc-status");
        chip.textContent=TC_STATUS[t.status]||t.status;
        chip.className="tc-status "+t.status;
        card.classList.toggle("done-card",t.status==="done");
        card.classList.toggle("failed-card",t.status==="failed");
        var subs=snap.subtasks||[];
        if(subs.length){
          var finN=subs.filter(function(s){return s.status==="done"||s.status==="failed"||s.status==="cancelled"}).length;
          card.querySelector(".tc-bar i").style.width=Math.round(finN/subs.length*100)+"%";
          var doneN=subs.filter(function(s){return s.status==="done"}).length;
          var subsEl=card.querySelector(".tc-subs");
          subsEl.innerHTML=subs.map(function(s){
            var err=s.error?' <span class="tc-err">'+escapeHtml(String(s.error).slice(0,60))+"</span>":"";
            return '<div class="tc-sub"><span class="st '+s.status+'">'+(TC_STATUS[s.status]||s.status)+
              '</span><span>'+escapeHtml((s.desc||"").slice(0,42))+err+"</span></div>";
          }).join("");
          var tg=card.querySelector(".tc-toggle");
          tg.style.display="";
          tg.textContent="子任务 "+doneN+"/"+subs.length;
        }
        if(t.status==="done"||t.status==="failed"){
          // 终态：展示结果（Markdown），过长的结果折叠
          var resEl=card.querySelector(".tc-result");
          var txt=(t.result||"").trim();
          if(!txt&&t.status==="failed")txt="任务失败："+(t.error||"未知错误");
          if(txt){
            resEl.classList.add("show");
            resEl.dataset.raw=txt;

      // 保留元素已有的 transform（scale/rotate）

      // 这里用单独 transform：translate(-px*mx*PARALLAX, -py*my*PARALLAX) 叠加在原 transform 上

      // 因为不同对象已有不同的 scale/rotate，简单的做法是外层包 translate；简化用内联
      el.style.marginLeft=(-px*mx*PARALLAX).toFixed(2)+"px";

    dockMode=m;
    convKind=m; // 聊天/任务历史分开：hover 显示对应类型会话
    for(var i=0;i<dockTabs.length;i++)dockTabs[i].className="dock-tab"+(dockTabs[i].getAttribute("data-mode")===m?" active":"");
    refreshPlaceholder();
    loadConvs(m);
    winSelectRender(); // 更新窗口选择器的"新建"选项
    document.getElementById("agent-selector").className="agent-selector"+(m==="task"?" visible":"");
    dockInput.focus();
  }
  for(var i=0;i<dockTabs.length;i++)(function(t){t.addEventListener("click",function(){setMode(t.getAttribute("data-mode"))})})(dockTabs[i]);
  function showReply(txt,keep){
    reply.textContent=txt;reply.style.display="block";
    clearTimeout(reply._t);
    reply._t=setTimeout(function(){reply.style.display="none"},keep||6000);
  }
  var lastSendTime=0;
  var sendThrottle=1500; // 发送间隔1.5秒
  function dockSendAction(){
    var v=dockInput.value.trim();
    if(!v)return;
    // 节流检查
    var now=Date.now();
    if(now-lastSendTime<sendThrottle){
      showReply("发送太频繁，请稍后再试",2000);
      return;
    }
    lastSendTime=now;
    var targetId=selectedWinId; // 当前选中的窗口
    // 检查是否需要先创建新窗口和会话
    if(pendingNewKind || !targetId){
      // 先创建真正的会话
      var title=pendingNewKind==="task"?"新任务":"新对话";
      fetch(MAESTRO+"/api/conversations",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({title:title,kind:pendingNewKind||"chat"})})
        .then(function(r){return r.json()})
        .then(function(d){
          var realConvId=d.conv_id;
          var newId=realConvId; // 用真实会话 ID 作为窗口 ID
          winCreate(newId,title,pendingNewKind||"chat");
          selectedWinId=newId;
          pendingNewKind=null;
          winSelectRender();
          // 发送消息
          doSend(newId,v);
        })
        .catch(function(){alert("创建会话失败")});
      resetDockInput();
      return;
    }
    resetDockInput();
    // 发送到选中的窗口
    doSend(targetId,v);
  }
  function doSend(targetId,v,retryCount){
    if(!targetId || !wins[targetId]){dockInput.value=v;return}
    retryCount=retryCount||0;
    var w=wins[targetId];
    winAppendMsg(targetId,"user",v);
    if(w.data.kind==="chat")showTyping(targetId); // 芙莉莲正在输入…
    if(w.data.kind==="chat"){
      // 聊天模式：流式回复（SSE）
      fetch(MAESTRO+"/api/chat/stream",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({message:v,conv_id:targetId,link_conv_ids:(convLinks[targetId]||[])})})
        .then(function(resp){
          if(!resp.ok||!resp.body)throw new Error("http "+resp.status);
          var reader=resp.body.getReader(),dec=new TextDecoder(),buf="";
          var visible="";
          function pump(){
            return reader.read().then(function(x){
              if(x.done){
                // 流结束：去流式光标 + 长回复折叠
                var wb=wins[targetId]&&wins[targetId].el.querySelector(".win-body");
                var lastDone=wb&&wb.lastElementChild;
                if(lastDone&&lastDone.classList.contains("assistant")&&!lastDone.classList.contains("typing")){
                  lastDone.dataset.text=visible;
                  var cDone=lastDone.querySelector(".msg-content");
                  if(cDone)cDone.innerHTML=mdRender(visible);
                  applyFold(lastDone,visible);
                }
                hideTyping(targetId);
                return;
              }
              buf+=dec.decode(x.value,{stream:true});
              var parts=buf.split("\n\n");
              buf=parts.pop();
              for(var i=0;i<parts.length;i++){
                var line=parts[i].trim();
                if(line.indexOf("data:")!==0)continue;
                try{
                  var d=JSON.parse(line.slice(5).trim());
                  if(d.delta)visible+=d.delta;
                }catch(e){}
              }
              // 更新最后一条消息（打字指示气泡就地转为正文，只重写 .msg-content）
              var body=wins[targetId]&&wins[targetId].el.querySelector(".win-body");
              if(!body)return;
              var lastMsg=body.lastElementChild;
              if(lastMsg&&lastMsg.classList.contains("typing")){
                lastMsg.classList.remove("typing");
                lastMsg.dataset.text="";
                lastMsg.innerHTML=AVATAR_HTML+'<div class="msg-content"></div><div class="msg-meta"><span class="win-time">'+new Date().toLocaleTimeString()+"</span></div>";
              }
              lastMsg=body.lastElementChild;
              if(lastMsg&&lastMsg.classList.contains("assistant")){
                lastMsg.dataset.text=visible;
                var cEl=lastMsg.querySelector(".msg-content");
                if(cEl)cEl.innerHTML=mdRender(visible)+'<span class="caret"></span>';
                else lastMsg.innerHTML=escapeHtml(visible)+'<div class="win-time">'+new Date().toLocaleTimeString()+"</div>";
              }else{
                winAppendMsg(targetId,"assistant",visible);
              }
              body.scrollTop=body.scrollHeight;
              return pump();
            });
          }
          return pump();
        })
        .catch(function(e){
          console.error("chat error:",e);
          hideTyping(targetId);
          // 网络错误时重试
          if(retryCount<2&&(e.message.includes("Failed to fetch")||e.message.includes("network")||e.message.includes("fetch"))){
            winAppendMsg(targetId,"assistant","网络不稳定，正在重试...");
            setTimeout(function(){doSend(targetId,v,retryCount+1)},1500);
          }else{
            winAppendMsg(targetId,"assistant","连接失败: "+e.message+"（点击消息重试）");
            // 点击失败消息重试
            var body=wins[targetId]&&wins[targetId].el.querySelector(".win-body");
            if(body){
              var lastMsg=body.lastElementChild;
              if(lastMsg&&lastMsg.textContent.includes("连接失败")){
                lastMsg.style.cursor="pointer";
                lastMsg.onclick=function(){doSend(targetId,v,0);lastMsg.onclick=null;lastMsg.textContent="重试中...";};
              }
            }
          }
        });
    }else{
      // 任务模式：派发任务
      var selectedAgents=Array.from(document.querySelectorAll("#agent-chips .agent-chip.selected"))
        .map(function(ch){return ch.dataset.name});
      if(selectedAgents.length===0)selectedAgents=["embedded"];
      var selectedModel=document.getElementById("model-select").value||null;
      fetch(MAESTRO+"/api/tasks",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({prompt:v,scenario:"auto",confirm:false,conv_id:targetId,selected_workers:selectedAgents,model:selectedModel})})
        .then(function(r){return r.json()})
        .then(function(d){
          var taskId=d.task_id;
          var agents=d.selected_workers&&d.selected_workers.length>0?d.selected_workers:["embedded"];
          if(taskId){
            // 富任务卡片：状态/进度/子任务/结果自带轮询
            winAppendTaskCard(targetId,taskId,agents,d.model||null,v);
          }else{
            winAppendMsg(targetId,"assistant","任务提交异常："+(d.error||"无 task_id"));
          }
          poll(); // 刷新任务列表
        })
        .catch(function(){winAppendMsg(targetId,"assistant","任务提交失败");});
    }
  }
  // 模式切换（聊天/任务）
    document.getElementById("mode-chat").addEventListener("click",function(){setMode("chat")});
    document.getElementById("mode-task").addEventListener("click",function(){setMode("task")});
    // 加载 agent 列表
    function loadAgents(){
      fetch(MAESTRO+"/api/agents").then(function(r){return r.json()}).then(function(agents){
        var chipsEl=document.getElementById("agent-chips");
        chipsEl.innerHTML="";
        agents.forEach(function(a){
          var chip=document.createElement("label");
          chip.className="agent-chip"+(a.available?"":" disabled");
          chip.dataset.name=a.name;
          chip.title=a.desc+(a.available?"":"（未连接）");
          chip.innerHTML='<input type="checkbox" value="'+a.name+'" />'+
            '<span class="chip-check"></span>'+
            '<span>'+escapeHtml(a.label)+'</span>'+
            '<span class="chip-dot"></span>';
          chip.addEventListener("click",function(e){
            if(chip.classList.contains("disabled"))return;
            e.preventDefault();
            chip.classList.toggle("selected");
            var cb=chip.querySelector("input");
            cb.checked=chip.classList.contains("selected");
          });
          chipsEl.appendChild(chip);
          if(a.name==="embedded"&&a.available){
            chip.classList.add("selected");
            chip.querySelector("input").checked=true;
          }
        });
      }).catch(function(){});
    }
    loadAgents();
    // 加载模型列表
    var _modelsCache=null;
    function loadModels(){
      fetch(MAESTRO+"/api/models").then(function(r){return r.json()}).then(function(models){
        _modelsCache=models;
        var sel=document.getElementById("model-select");
        sel.innerHTML="";
        var grouped={};
        models.forEach(function(m){
          var prov=m.provider||"other";
          if(!grouped[prov])grouped[prov]={label:prov,models:[]};
          grouped[prov].models.push(m);
        });
        var row=document.getElementById("model-row");
        if(models.length===0){row.style.display="none";return;}
        row.style.display="flex";
        Object.keys(grouped).forEach(function(prov){
          var optgroup=document.createElement("optgroup");
          optgroup.label=grouped[prov].label;
          grouped[prov].models.forEach(function(m){
            var o=document.createElement("option");
            o.value=m.id;
            o.textContent=m.label+" — "+m.desc;
            o.title=m.key_label||"";
            optgroup.appendChild(o);
          });
          sel.appendChild(optgroup);
        });
        if(models.length>0)sel.value=models[0].id;
      }).catch(function(){document.getElementById("model-row").style.display="none"});
    }
    loadModels();

  // 窗口选择下拉菜单
  var winSelectBtn=document.getElementById("win-select-btn");
  var winSelectVal=document.getElementById("win-select-val");
  var winSelectDropdown=document.getElementById("win-select-dropdown");
  var selectedWinId=null; // 当前选中的窗口 ID
  var pendingNewKind=null; // 待创建窗口的类型（用户点了新建但还没发消息）

  function winSelectRender(){
    var ids=Object.keys(wins);
    var kindLabel=dockMode==="task"?"任务":"聊天";
    var pendingLabel=pendingNewKind?"（待发送）":"";
    var html='<div class="win-select-item" data-action="new">+ 新建 '+kindLabel+' 窗口'+pendingLabel+'</div>';
    if(ids.length>0){
      html+=ids.map(function(k){
        var w=wins[k];
        var active=k===selectedWinId?" active":"";
        return '<div class="win-select-item'+active+'" data-id="'+k+'">'+escapeHtml(w.data.title.slice(0,15))+' ['+(w.data.kind==="task"?"任务":"聊天")+']</div>';
      }).join("");
    }else{
      html+='<div class="win-select-empty">暂无打开的窗口</div>';
    }
    winSelectDropdown.innerHTML=html;
    var sel=wins[selectedWinId];
    if(sel)winSelectVal.textContent=sel.data.title.slice(0,8);
    else winSelectVal.textContent="选择窗口";
    // 绑定点击事件
    winSelectDropdown.querySelectorAll(".win-select-item").forEach(function(it){
      it.addEventListener("click",function(){
        if(it.dataset.action==="new"){
          // 标记待创建窗口（发送消息时才真正创建）
          pendingNewKind=dockMode;
          winSelectRender();
        }else{
          selectedWinId=it.dataset.id;
          pendingNewKind=null; // 清除待创建状态
          updateWinFocus(selectedWinId);
          updateDockPlaceholder();
          winSelectRender();
        }
        document.getElementById("win-select").classList.remove("open");
        dockInput.focus();
      });
    });
  }
  // 点击按钮切换下拉
  winSelectBtn.addEventListener("click",function(e){
    e.stopPropagation();
    winSelectRender();
    document.getElementById("win-select").classList.toggle("open");
  });
  // 点击其他地方关闭下拉
  document.addEventListener("click",function(){
    document.getElementById("win-select").classList.remove("open");
  });
  // 窗口创建/关闭时更新下拉
  var _winTabsRender=winTabsRender;
  winTabsRender=function(){
    _winTabsRender();
    winSelectRender();
  };

  function resetDockInput(){dockInput.value="";dockInput.style.height="auto";}
  dockSend.addEventListener("click",dockSendAction);
  // 多行输入：Enter 发送，Shift+Enter 换行；随内容自动增高
  dockInput.addEventListener("keydown",function(e){
    if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();dockSendAction();resetDockInput();}
  });
  dockInput.addEventListener("input",function(){
    dockInput.style.height="auto";
    dockInput.style.height=Math.min(dockInput.scrollHeight,110)+"px";
  });

  // 历史按钮：hover 出会话列表；点击查看当前会话历史消息
  var historyBtn=document.getElementById("history-btn");
  var historyPanel=document.getElementById("history-panel");
  var historyList=document.getElementById("history-list");
  function openHistory(convId,convTitle,retryCount){
    retryCount=retryCount||0;
    historyList.innerHTML='<div class="hp-empty">加载中…</div>';
    document.getElementById("hp-title").textContent=convTitle?("历史对话 · "+convTitle):"历史对话";
    historyPanel.classList.add("show");
    var url=MAESTRO+"/api/chat/history?limit=100"+(convId?("&conv_id="+encodeURIComponent(convId)):"");
    fetch(url,{cache:"no-store"})
      .then(function(r){return r.json()})
      .then(function(d){
        var msgs=d.messages||[];
        if(!msgs.length){historyList.innerHTML='<div class="hp-empty">这个对话还没有消息</div>';return}
        var html="";
        for(var i=0;i<msgs.length;i++){
          var m=msgs[i];
          var role=m.role==="user"?"user":"assistant";
          var t=(m.created_at||"").replace("T"," ").slice(0,16);
          html+='<div class="hp-msg '+role+'"><div>'+escapeHtml(m.content)+'</div><div class="hp-time">'+t+'</div></div>';
        }
        historyList.innerHTML=html;
        historyList.scrollTop=historyList.scrollHeight;
      })
      .catch(function(){
        // 加载失败，显示重试按钮
        if(retryCount<2){
          historyList.innerHTML='<div class="hp-empty" style="text-align:center">加载失败<br><input type="button" id="hp-retry" value="重试" style="margin-top:10px;padding:4px 14px;background:#5b6bb5;color:#fff;border:none;border-radius:4px;cursor:pointer"/></div>';
          var retryBtn=document.getElementById("hp-retry");
          if(retryBtn)retryBtn.onclick=function(){openHistory(convId,convTitle,retryCount+1)};
        }else{
          historyList.innerHTML='<div class="hp-empty">多次加载失败，请检查网络连接</div>';
        }
      });
  }
  historyBtn.addEventListener("click",function(){openHistory(currentConv?currentConv.id:null,currentConv?currentConv.title:"")});
  document.getElementById("history-close").addEventListener("click",function(){historyPanel.classList.remove("show")});
  historyPanel.addEventListener("click",function(e){if(e.target===historyPanel)historyPanel.classList.remove("show")});

  // 历史面板拖拽：按住标题栏拖动（首次拖动时从 transform 居中切换为 left/top 定位）
  var hpDrag={active:false,offX:0,offY:0,inited:false};
  var hpHead=document.querySelector("#history-panel .hp-head");
  hpHead.addEventListener("mousedown",function(e){
    if(e.target.closest(".hp-close"))return; // 关闭按钮不触发拖动
    var rect=historyPanel.getBoundingClientRect();
    if(!hpDrag.inited){
      historyPanel.style.left=rect.left+"px";
      historyPanel.style.top=rect.top+"px";
      historyPanel.style.transform="none";
      hpDrag.inited=true;
    }
    hpDrag.active=true;
    hpDrag.offX=e.clientX-rect.left;
    hpDrag.offY=e.clientY-rect.top;
    e.preventDefault();
  });
  document.addEventListener("mousemove",function(e){
    if(!hpDrag.active)return;
    var r=historyPanel.getBoundingClientRect();
    var x=Math.min(Math.max(e.clientX-hpDrag.offX,-r.width+60),innerWidth-60);
    var y=Math.min(Math.max(e.clientY-hpDrag.offY,0),innerHeight-40);
    historyPanel.style.left=x+"px";
    historyPanel.style.top=y+"px";
  });
  document.addEventListener("mouseup",function(){hpDrag.active=false});
  refreshPlaceholder();
  loadConvs();

  // ========== WebSocket 消息路由 ==========
  // 连接后端 WebSocket，接收消息并根据 conv_id 路由到对应窗口
  (function(){
    var ws=null;
    var reconnectTimer=null;
    var WS_URL=MAESTRO.replace("http","ws")+"/ws";

    function connectWS(){
      try{
        ws=new WebSocket(WS_URL);
        ws.onopen=function(){
          console.log("[WS] 已连接");
          if(reconnectTimer){clearTimeout(reconnectTimer);reconnectTimer=null}
        };
        ws.onmessage=function(event){
          try{
            var msg=JSON.parse(event.data);
            // 消息格式：{conv_id, role, content} 或 {type, conv_id, ...}
            var convId=msg.conv_id;
            if(!convId)return; // 没有 conv_id 的消息忽略

            var role=msg.role||"assistant";
            var content=msg.content||msg.text||"";
            if(!content)return;

            // 根据 conv_id 查找窗口
            var w=wins[convId];
            if(w){
              // 去重：服务端在 SSE 流结束后会把完整回复再广播一遍，而本窗口
              // 已经流式渲染过同一条回复（dataset.text 存原文）。内容一致时跳过，
              // 只在本地流式失败（没有对应气泡）时才真正追加兜底。
              if(role==="assistant"&&content){
                var body=w.el.querySelector(".win-body");
                var last=body&&body.lastElementChild;
                if(last&&last.classList.contains("assistant")&&last.dataset.text===content){
                  return;
                }
              }
              winAppendMsg(convId,role,content);
            }else{
              // 窗口不存在，可以选择创建新窗口或忽略
              // 这里选择忽略，也可以通知用户
              console.log("[WS] 收到未知会话的消息，conv_id:",convId);
            }
          }catch(e){
            console.error("[WS] 消息解析失败:",e);
          }
        };
        ws.onclose=function(){
          console.log("[WS] 连接关闭，3秒后重连...");
          reconnectTimer=setTimeout(connectWS,3000);
        };
        ws.onerror=function(e){
          console.error("[WS] 错误:",e);
        };
      }catch(e){
        console.error("[WS] 连接失败:",e);
        reconnectTimer=setTimeout(connectWS,5000);
      }
    }

    // 页面加载后连接 WebSocket
    setTimeout(connectWS,1000);
  })();
})();
</script>
