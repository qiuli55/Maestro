<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Maestro Wallpaper · 2D 数字人</title>
<style>
  :root { color-scheme: dark; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden;
    background: radial-gradient(ellipse at 50% 42%, #122038 0%, #0a1322 55%, #03050a 100%); }
  #live2d, #placeholder { position: fixed; inset: 0; display: block; width: 100%; height: 100%; }

  /* 立绘兜底：Live2D 模型不可用/异常时显示完整立绘（透明 PNG），由脚本控制显隐 */
  #char {
    position: fixed; inset: 0; width: 100%; height: 100%;
    object-fit: contain; object-position: center 58%;
    z-index: 1; pointer-events: none; user-select: none;
  }
  #live2d { z-index: 2; }

  /* 角落品牌标识 */
  .brand {
    position: fixed; left: 42px; bottom: 40px;
    font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    color: #e8ecf6; user-select: none; pointer-events: none;
  }
  .brand .logo {
    font-size: 34px; font-weight: 700; letter-spacing: 2px;
    background: linear-gradient(90deg, #6ea8ff, #b388ff);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .brand .sub { margin-top: 6px; font-size: 13px; color: #8a94ad; letter-spacing: 1px; }

  /* 底部状态条 */
  .status {
    position: fixed; right: 42px; bottom: 46px;
    display: flex; align-items: center; gap: 9px;
    font-family: "Segoe UI", "PingFang SC", system-ui, sans-serif;
    font-size: 13px; color: #aab4cc; user-select: none; pointer-events: none;
  }
  .dot {
    width: 9px; height: 9px; border-radius: 50%; background: #4ade80;
    box-shadow: 0 0 10px #4ade80; animation: pulse 2s ease-in-out infinite;
  }
  @keyframes pulse { 0%,100% { opacity: 1; transform: scale(1); } 50% { opacity: .4; transform: scale(.8); } }

  /* 未放模型时的开发提示（加载成功后自动隐藏） */
  .hint {
    position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
    max-width: 600px; text-align: center;
    font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    font-size: 15px; line-height: 1.8; color: #9fb0d0; user-select: none; pointer-events: none;
    background: rgba(10,16,30,.55); border: 1px solid rgba(120,160,255,.25);
    padding: 18px 26px; border-radius: 14px; backdrop-filter: blur(4px);
  }
  .hint code { color: #cdd9ff; background: rgba(110,168,255,.12); padding: 1px 6px; border-radius: 5px; }

  /* ── 数字人闲聊（气泡 + 输入框） ── */
  #chat {
    position: fixed; left: 42px; bottom: 90px; width: 320px; z-index: 10;
    font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    pointer-events: auto; user-select: none;
  }
  #chat-bubbles {
    max-height: 260px; overflow-y: auto; margin-bottom: 10px;
    display: flex; flex-direction: column; gap: 8px;
  }
  .c-bubble {
    max-width: 86%; padding: 8px 12px; border-radius: 13px; font-size: 13.5px;
    line-height: 1.55; color: #e8ecf6; background: rgba(20,30,52,.82);
    border: 1px solid rgba(120,160,255,.22); backdrop-filter: blur(4px);
    word-break: break-word; animation: pop .18s ease-out;
  }
  .c-bubble.user { align-self: flex-end; background: rgba(70,110,200,.55); border-color: rgba(120,160,255,.4); }
  .c-bubble.bot { align-self: flex-start; }
  @keyframes pop { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
  #chat-input {
    display: flex; gap: 8px; align-items: center;
  }
  #chat-input input {
    flex: 1; background: rgba(16,24,42,.85); border: 1px solid rgba(120,160,255,.3);
    border-radius: 20px; padding: 9px 15px; font-size: 13.5px; color: #e8ecf6;
    outline: none; font-family: inherit;
  }
  #chat-input input:focus { border-color: rgba(120,160,255,.65); }
  #chat-input button {
    width: 38px; height: 38px; border-radius: 50%; border: 0; cursor: pointer;
    background: linear-gradient(135deg, #6ea8ff, #b388ff); color: #0a1322;
    font-size: 16px; font-weight: 700; flex: none;
  }
  #chat-input button:disabled { opacity: .5; cursor: default; }
  .c-typing { align-self: flex-start; color: #8a94ad; font-size: 12.5px; padding: 2px 4px; }

</style>
</head>
<body>
  <canvas id="live2d"></canvas>
  <canvas id="placeholder"></canvas>
  <img id="char" src="./models/source/user_char_ref.png" alt="">
  <div class="brand">
    <div class="logo">Maestro</div>
    <div class="sub">多 Agent 编排器 · 2D 数字人壁纸</div>
  </div>
  <div class="status"><span class="dot"></span><span>编排器就绪</span></div>
  <div id="chat">
    <div id="chat-bubbles"></div>
    <div id="chat-input">
      <input type="text" placeholder="和 Maestro 说点什么…" maxlength="500" />
      <button id="chat-send" title="发送">➤</button>
    </div>
  </div>
  <div id="hint" class="hint">
    把用 <code>Live2D Cubism</code> 导出的模型放到<br>
    <code>wallpaper/models/live2d/avatar/model3.json</code><br>
    二次元数字人即会显示在这里（当前为占位形象，自带呼吸/眨眼动画）。
  </div>

  <!--
    本地离线依赖（wallpaper/vendor/），不再依赖任何 CDN：
      - live2dcubismcore.min.js：Live2D Cubism 4 官方核心运行时（全局 Live2DCubismCore）
      - live2d.bundle.js：pixi.js v6 + pixi-live2d-display(Cubism4) 打包，暴露全局 PIXI.live2d
    打包来源：npm pixi.js@6.5.10 + pixi-live2d-display@0.4.0，经 esbuild 合并为 IIFE。
  -->
  <script src="./vendor/live2dcubismcore.min.js"></script>
  <script src="./vendor/live2d.bundle.js"></script>

  <script>
  (function () {
    // 模型入口：你的 Live2D 模型目录下的 model3.json
    const MODEL_PATH = "./models/live2d/avatar/model3.json";
    const hint = document.getElementById("hint");
    const placeholder = document.getElementById("placeholder");

    // 优先尝试加载真·Live2D 模型
    if (window.PIXI && window.PIXI.live2d && window.Live2DCubismCore) {
      try {
        // 本版采用“静态渲染一帧”策略（autoStart:false + 手动 app.render()）：不持续刷新渲染循环，
        // 从根上规避真机 WebGL 与浏览器合成层持续重叠加导致的闪烁。故不需要持续 ticker；
        // registerTicker 保留以兼容库内部，无副作用。
        PIXI.live2d.Live2DModel.registerTicker(PIXI.Ticker);

        const app = new PIXI.Application({
          view: document.getElementById("live2d"),
          width: window.innerWidth, height: window.innerHeight,
          backgroundAlpha: 1, backgroundColor: 0x060a14, antialias: false, autoStart: false,
          preserveDrawingBuffer: true,   // 防止浏览器合成时偶发整帧空白（真机闪烁常见成因）
          autoDensity: true,
          resolution: Math.min(window.devicePixelRatio || 1, 2),
        });
        // WebGL 上下文丢失时阻止默认销毁，让浏览器尝试自动恢复；恢复后补渲染一帧。
        app.view.addEventListener("webglcontextlost", (e) => e.preventDefault(), false);
        app.view.addEventListener("webglcontextrestored", () => {
          try { app.render(); } catch (e) { /* 忽略恢复期渲染异常 */ }
        }, false);
        PIXI.live2d.Live2DModel.from(MODEL_PATH, { autoInteract: false })
          .then((model) => {
            app.stage.addChild(model);
            fitModel(app, model);   // 自适应尺寸并渲染一帧（fitModel 末尾已 app.render()）
            // 模型健康检查：读取 ArtMesh 包围盒，内容太窄/太矮（如导出器 bug 产出的
            // 单点小图）或部件被分离时，判定模型异常 → 保持立绘兜底显示。
            const healthy = (() => {
              try {
                const im = model.internalModel;
                if (!im) return false;
                // bounds = 渲染内容的实际包围盒（归一化单位）。内容太窄/太矮
                // （如导出器 bug 产出的单点小图）或部件被分离时判定异常。
                const b = im.bounds || (im.coreModel && (() => {
                  const D = im.coreModel.drawables;
                  let ax0 = 1e9, ay0 = 1e9, ax1 = -1e9, ay1 = -1e9;
                  for (let i = 0; i < D.count; i++) {
                    const vp = D.vertexPositions[i];
                    if (!vp) continue;
                    for (let j = 0; j < vp.length; j += 2) {
                      const x = vp[j], y = vp[j + 1];
                      if (x < ax0) ax0 = x; if (x > ax1) ax1 = x;
                      if (y < ay0) ay0 = y; if (y > ay1) ay1 = y;
                    }
                  }
                  return { w: ax1 - ax0, h: ay1 - ay0 };
                })());
                if (!b || typeof b.w !== "number") return false;
                console.log("[Maestro] model content bbox", b.w.toFixed(3), "x", b.h.toFixed(3));
                return b.w > 0.25 && b.h > 0.25;
              } catch (e) { console.warn("[Maestro] health check err", e); return false; }
            })();
            if (healthy) {
              document.getElementById("char").style.display = "none";
            } else {
              console.warn("[Maestro] 模型异常（部件错位/内容过小），保持立绘兜底显示。");
              app.stage.removeChild(model);
              try { model.destroy(); } catch (e) { /* 忽略 */ }
              app.view.style.display = "none";   // 隐藏不透明 WebGL 画布，让下方立绘可见
              document.getElementById("char").style.display = "block";
            }
            placeholder.style.display = "none";
            hint.style.display = "none";
          })
          .catch((err) => {
            console.warn("[Maestro] 未找到 Live2D 模型，显示占位形象。", err);
            showPlaceholder();
          });
        // 注意：这里不能 return，否则会跳过后续闲聊代码初始化。
        // 模型加载是异步的（from().then()），闲聊 UI 初始化与模型加载互不阻塞。
      } catch (e) {
        console.warn("[Maestro] Live2D 初始化失败，显示占位。", e);
      }
    } else {
      console.warn("[Maestro] Cubism Web SDK 未加载（可能离线），显示占位。");
    }
    showPlaceholder();

    // 模型自适应：按视口高度缩放到 90%，底部锚定、水平居中
    function fitModel(app, model) {
      function apply() {
        app.renderer.resize(window.innerWidth, window.innerHeight);
        const s = (window.innerHeight * 0.9) / model.height;
        model.scale.set(s);
        model.x = (window.innerWidth - model.width * s) / 2;
        model.y = window.innerHeight - model.height * s;
        app.render();   // 静态渲染一帧：不持续刷新，彻底避免真机 WebGL 合成闪烁
      }
      apply();
      let _rt;
      window.addEventListener("resize", () => { clearTimeout(_rt); _rt = setTimeout(apply, 200); });
    }

    // 没有可用模型时的兜底：显示完整立绘（透明 PNG），带轻微呼吸缩放
    function showPlaceholder() {
      const char = document.getElementById("char");
      char.style.display = "block";
      placeholder.style.display = "none";   // 不再画二次元占位形象，直接用真实立绘
      let t = 0;
      function draw() {
        t += 0.016;
        const breath = 1 + Math.sin(t * 1.2) * 0.008;   // 极轻微呼吸缩放
        char.style.transform = "scale(" + breath.toFixed(4) + ")";
        requestAnimationFrame(draw);
      }
      draw();
    }

    // ── 数字人闲聊 ──
    const MAESTRO = "http://127.0.0.1:8787";
    const bubbles = document.getElementById("chat-bubbles");
    const chatInput = document.querySelector("#chat-input input");
    const chatSend = document.getElementById("chat-send");

    function addBubble(text, who) {
      const el = document.createElement("div");
      el.className = "c-bubble " + who;
      el.textContent = text;
      bubbles.appendChild(el);
      bubbles.scrollTop = bubbles.scrollHeight;
      return el;
    }

    function setTyping(on) {
      let t = bubbles.querySelector(".c-typing");
      if (on && !t) {
        t = document.createElement("div");
        t.className = "c-typing";
        t.textContent = "Maestro 正在想…";
        bubbles.appendChild(t);
        bubbles.scrollTop = bubbles.scrollHeight;
      } else if (!on && t) {
        t.remove();
      }
    }

    async function send() {
      const text = chatInput.value.trim();
      if (!text) return;
      chatInput.value = "";
      chatSend.disabled = true;
      addBubble(text, "user");
      setTyping(true);
      try {
        const r = await fetch(MAESTRO + "/api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message: text }),
        });
        if (!r.ok) throw new Error("HTTP " + r.status);
        const d = await r.json();
        setTyping(false);
        addBubble(d.reply, "bot");
      } catch (e) {
        setTyping(false);
        addBubble("（连不上编排器服务，稍后再试）", "bot");
      } finally {
        chatSend.disabled = false;
        chatInput.focus();
      }
    }

    chatSend.addEventListener("click", send);
    chatInput.addEventListener("keydown", function (e) {
      if (e.key === "Enter") send();
    });

    // 加载历史记录
    (async function loadHistory() {
      try {
        const r = await fetch(MAESTRO + "/api/chat/history?limit=20");
        if (!r.ok) return;
        const d = await r.json();
        (d.messages || []).forEach(function (m) {
          addBubble(m.content, m.role === "user" ? "user" : "bot");
        });
      } catch (e) { /* 无历史或服务未起，忽略 */ }
    })();
  })();
  </script>
</body>
</html>
