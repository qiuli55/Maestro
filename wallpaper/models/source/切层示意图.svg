<svg viewBox="0 0 400 700" xmlns="http://www.w3.org/2000/svg">
  <!-- 背景占位，实际使用时把 character_ref.png 放在底层对照 -->
  <rect width="400" height="700" fill="#f8f9fa"/>

  <!-- 身体区域 -->
  <ellipse cx="200" cy="420" rx="110" ry="170" fill="none" stroke="#e74c3c" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="200" y="600" text-anchor="middle" font-size="14" fill="#e74c3c">body（躯干+裙子）</text>

  <!-- 左臂 -->
  <path d="M95 260 Q60 350 75 430" fill="none" stroke="#3498db" stroke-width="2"/>
  <text x="50" y="350" font-size="12" fill="#3498db">arm_L</text>

  <!-- 右臂 -->
  <path d="M305 260 Q340 350 325 430" fill="none" stroke="#3498db" stroke-width="2"/>
  <text x="340" y="350" font-size="12" fill="#3498db">arm_R</text>

  <!-- 后发 -->
  <path d="M120 120 Q90 250 110 380 Q200 420 290 380 Q310 250 280 120" fill="none" stroke="#8e44ad" stroke-width="2" stroke-dasharray="5,3"/>
  <text x="320" y="200" font-size="12" fill="#8e44ad">hair_back</text>

  <!-- 脸型 -->
  <ellipse cx="200" cy="160" rx="55" ry="65" fill="none" stroke="#f39c12" stroke-width="2"/>
  <text x="200" y="245" text-anchor="middle" font-size="12" fill="#f39c12">face</text>

  <!-- 前发 -->
  <path d="M145 110 Q200 80 255 110 Q245 160 200 150 Q155 160 145 110" fill="none" stroke="#9b59b6" stroke-width="2"/>
  <text x="200" y="95" text-anchor="middle" font-size="12" fill="#9b59b6">hair_front</text>

  <!-- 眼睛 -->
  <ellipse cx="180" cy="155" rx="14" ry="10" fill="none" stroke="#2ecc71" stroke-width="2"/>
  <ellipse cx="220" cy="155" rx="14" ry="10" fill="none" stroke="#2ecc71" stroke-width="2"/>
  <text x="170" y="150" font-size="11" fill="#2ecc71">eye_L</text>
  <text x="230" y="150" font-size="11" fill="#2ecc71">eye_R</text>

  <!-- 嘴 -->
  <ellipse cx="200" cy="195" rx="12" ry="6" fill="none" stroke="#e67e22" stroke-width="2"/>
  <text x="200" y="215" text-anchor="middle" font-size="11" fill="#e67e22">mouth</text>

  <!-- 发饰 -->
  <circle cx="245" cy="110" r="12" fill="none" stroke="#1abc9c" stroke-width="2"/>
  <text x="270" y="105" font-size="11" fill="#1abc9c">head_accessory</text>

  <!-- 说明 -->
  <rect x="10" y="10" width="380" height="70" rx="6" fill="rgba(255,255,255,0.9)" stroke="#ccc"/>
  <text x="200" y="35" text-anchor="middle" font-size="13" fill="#333">切层区域示意（叠在 character_ref.png 上对照）</text>
  <text x="200" y="55" text-anchor="middle" font-size="11" fill="#666">每个色块/虚线框 = 一个独立图层，详见 切层说明.md</text>
</svg>
